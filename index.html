<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Path · 金途 | 香港賽馬數據分析</title>
<style>
:root {
  --bg: #f8f4ed; --card: #fffdf9; --accent: #8a9a5b; --accent-strong: #6b7c4a;
  --text: #3a3a32; --text-dim: #7a7568; --border: #e8e2d6; --gold: #c9a84c;
  --shadow: 0 2px 8px rgba(58,58,50,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK TC", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 48px; height: 48px; background: #2c3e2f; border: 2px solid #a8c686; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.logo-icon svg { width: 28px; height: 28px; }
.logo-text { font-weight: 700; font-size: 18px; color: #2c3e2f; }
.logo-sub { font-size: 12px; color: var(--text-dim); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: transparent; border: none; color: var(--text-dim); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.nav button.active, .nav button:hover { background: #f0eadf; color: var(--accent-strong); }
.container { max-width: 1280px; margin: 0 auto; padding: 28px; }
.page { display: none; }
.page.active { display: block; }
.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
.card h3 { margin-bottom: 14px; font-size: 16px; color: var(--accent-strong); }
.horse-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.horse-row:last-child { border: none; }
.prob-bar { height: 8px; background: #f0eadf; border-radius: 4px; flex: 1; margin: 0 12px; overflow: hidden; }
.prob-fill { height: 100%; background: var(--accent); border-radius: 4px; }
.badge { background: #e8f0dc; color: var(--accent-strong); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; }
.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.error { color: #c45c5c; padding: 12px; background: #fdf2f2; border-radius: 8px; }
.chart-area { height: 180px; background: linear-gradient(180deg, #f5f0e6 0%, #faf8f4 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); margin-top: 12px; position: relative; overflow: hidden; }
.trend-line { position: absolute; bottom: 20px; left: 20px; right: 20px; height: 2px; background: var(--accent); }
footer { text-align: center; padding: 28px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .header { flex-direction: column; gap: 12px; align-items: flex-start; } }
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 18c2-1 4-3 6-2s3 4 5 3 3-4 4-6c1-2 2-5 1-7-1-2-3-2-4-1s-2 3-4 3-3-2-5-1-3 4-4 6 1 5 1 5z"/>
        <path d="M14 8l2-1 1 2"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">金途</div>
      <div class="logo-sub">Golden Path · 香港賽馬數據分析</div>
    </div>
  </div>
  <nav class="nav">
    <button class="active" onclick="showPage('dashboard')">總覽</button>
    <button onclick="showPage('race')">單場分析</button>
    <button onclick="showPage('results')">賽果及派彩</button>
    <button onclick="showPage('horse')">馬匹詳情</button>
    <button onclick="showPage('prediction')">預測中心</button>
    <button onclick="showPage('stats')">數據分析</button>
  </nav>
</header>

<div class="container">
  <section id="dashboard" class="page active">
    <div id="dashboard-content"><div class="loading">載入真實賽事數據中...</div></div>
  </section>

  <section id="race" class="page">
    <div class="card">
      <h3>單場分析</h3>
      <div style="margin-bottom:16px;">
        <label>選擇場次： </label>
        <select id="race-select" onchange="loadRaceOdds()" style="padding:6px 12px; border-radius:8px; border:1px solid var(--border);">
          <option value="1">第1場</option>
          <option value="2">第2場</option>
          <option value="3">第3場</option>
          <option value="4">第4場</option>
          <option value="5">第5場</option>
        </select>
      </div>
      <div id="race-odds-content"><div class="loading">選擇場次載入倍率...</div></div>
      <div class="chart-area" id="odds-chart">
        <span>即時賠率走勢（載入後顯示）</span>
        <div class="trend-line" style="width:70%;"></div>
      </div>
    </div>
  </section>

  <section id="results" class="page">
    <div class="card">
      <h3>賽果及派彩</h3>
      <p style="color:var(--text-dim); margin-bottom:16px;">從香港賽馬會取得最新賽果（需有已完成賽事）</p>
      <button onclick="loadResults()" style="background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">重新載入賽果</button>
      <div id="results-content" style="margin-top:20px;"><div class="loading">點擊按鈕載入賽果...</div></div>
    </div>
  </section>

  <section id="horse" class="page"><div class="card"><h3>馬匹詳情</h3><p>往績與評分走勢（即將加入真實數據）。</p></div></section>
  <section id="prediction" class="page"><div class="card"><h3>預測中心</h3><p>今日預測排名。</p></div></section>
  <section id="stats" class="page"><div class="card"><h3>數據分析</h3><p>騎師與練馬師統計。</p></div></section>
</div>

<footer>
  資料來源：香港賽馬會 · 僅供參考 · 請理性投注<br>
  Golden Path · 金途 © 2026
</footer>

<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'dashboard') loadDashboard();
  if (id === 'race') loadRaceOdds();
}

async function fetchAPI(type, params = {}) {
  const qs = new URLSearchParams({ type, ...params }).toString();
  const res = await fetch(`/api/races?${qs}`);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || data.note || 'API 錯誤');
  return data.data;
}

async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const meetings = await fetchAPI('meetings');
    if (!meetings || meetings.length === 0) {
      el.innerHTML = '<div class="card"><h3>目前沒有進行中的賽事</h3><p style="color:var(--text-dim);">請稍後再試，或查看賽果頁面。</p></div>';
      return;
    }
    let html = '<div class="grid grid-2">';
    meetings.forEach(m => {
      const venue = m.venueCode === 'ST' ? '沙田' : m.venueCode === 'HV' ? '跑馬地' : m.venueCode;
      html += `<div class="card">
        <h3>${venue} · ${m.date || ''}</h3>
        <div class="badge">${m.races?.length || 0} 場賽事</div>
        <p style="margin:10px 0; color:var(--text-dim);">狀態：${m.status || '進行中'}</p>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="error">載入失敗：${e.message}</div>`;
  }
}

async function loadRaceOdds() {
  const race = document.getElementById('race-select').value;
  const el = document.getElementById('race-odds-content');
  el.innerHTML = '<div class="loading">載入倍率中...</div>';
  try {
    const odds = await fetchAPI('odds', { race, odds: 'WIN,PLA' });
    if (!odds || odds.length === 0) {
      el.innerHTML = '<p>暫無倍率數據</p>';
      return;
    }
    let html = '<table><thead><tr><th>類型</th><th>組合</th><th>倍率</th></tr></thead><tbody>';
    odds.forEach(pool => {
      (pool.oddsNodes || []).slice(0, 8).forEach(node => {
        html += `<tr><td>${pool.oddsType}</td><td>${node.combString}</td><td><strong>${node.oddsValue}</strong></td></tr>`;
      });
    });
    html += '</tbody></table>';
    el.innerHTML = html;
    document.getElementById('odds-chart').innerHTML = '<span>已載入即時倍率（走勢圖需多次輪詢）</span><div class="trend-line" style="width:85%; background:var(--accent);"></div>';
  } catch (e) {
    el.innerHTML = `<div class="error">載入失敗：${e.message}</div>`;
  }
}

async function loadResults() {
  const el = document.getElementById('results-content');
  el.innerHTML = '<div class="loading">載入賽果中...</div>';
  try {
    const races = await fetchAPI('races');
    el.innerHTML = `<div class="card"><h3>賽事資料已載入</h3><p>共 ${races?.length || 0} 個賽事會議。完整賽果需等待賽事結束後由 HKJC 更新。</p><pre style="background:#f5f0e6; padding:12px; border-radius:8px; overflow:auto; font-size:12px;">${JSON.stringify(races?.slice(0,1), null, 2).substring(0, 500)}...</pre></div>`;
  } catch (e) {
    el.innerHTML = `<div class="error">載入失敗：${e.message}</div>`;
  }
}

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
