<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Path · 金途 | 香港賽馬數據分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --bg:#f8f4ed; --card:#fffdf9; --accent:#8a9a5b; --accent-strong:#6b7c4a; --text:#3a3a32; --text-dim:#7a7568; --border:#e8e2d6; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK TC",sans-serif; background:var(--bg); color:var(--text); margin:0; }
.header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:var(--card); border-bottom:1px solid var(--border); }
.logo-icon { width:48px; height:48px; background:#2c3e2f; border:2px solid #a8c686; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; }
.nav button { background:transparent; border:none; padding:10px 16px; border-radius:10px; cursor:pointer; }
.nav button.active { background:#f0eadf; color:var(--accent-strong); }
.container { max-width:1280px; margin:0 auto; padding:28px; }
.page { display:none; } .page.active { display:block; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; margin-bottom:20px; }
.loading { text-align:center; padding:40px; color:var(--text-dim); }
.chart-container { height:260px; margin-top:16px; }
table { width:100%; border-collapse:collapse; } th,td { padding:10px; border-bottom:1px solid var(--border); text-align:left; }
</style>
</head>
<body>
<header class="header">
  <div><span class="logo-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.5"><path d="M4 18c2-1 4-3 6-2s3 4 5 3 3-4 4-6c1-2 2-5 1-7-1-2-3-2-4-1s-2 3-4 3-3-2-5-1-3 4-4 6 1 5 1 5z"/></svg></span> <strong>金途</strong> Golden Path</div>
  <nav class="nav">
    <button class="active" onclick="showPage('dashboard')">總覽</button>
    <button onclick="showPage('race')">單場分析</button>
    <button onclick="showPage('results')">賽果</button>
    <button onclick="showPage('horse')">馬匹詳情</button>
  </nav>
</header>
<div class="container">
  <section id="dashboard" class="page active"><div id="dashboard-content" class="loading">載入中...</div></section>
  <section id="race" class="page">
    <div class="card">
      <h3>單場分析 · 即時倍率走勢</h3>
      <select id="race-select" onchange="startOddsTracking()"><option value="1">第1場</option><option value="2">第2場</option><option value="3">第3場</option><option value="4">第4場</option><option value="5">第5場</option></select>
      <div id="race-odds-content" class="loading">載入倍率...</div>
      <div class="chart-container"><canvas id="oddsChart"></canvas></div>
      <p style="font-size:12px;color:#7a7568;">每15秒自動刷新 · Chart.js 走勢圖</p>
    </div>
  </section>
  <section id="results" class="page"><div class="card"><h3>賽果及派彩</h3><button onclick="loadResults()">載入賽果</button><div id="results-content"></div></div></section>
  <section id="horse" class="page"><div class="card"><h3>馬匹詳細往績</h3><div id="horse-content" class="loading">載入中...</div></div></section>
</div>
<script>
let oddsChart, refreshInterval, oddsHistory = {};
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'dashboard') loadDashboard();
  if (id === 'race') startOddsTracking();
  if (id === 'horse') loadHorseDetails();
  if (refreshInterval && id !== 'race') clearInterval(refreshInterval);
}
async function fetchAPI(type, params={}) {
  const qs = new URLSearchParams({type, ...params});
  const res = await fetch('/api/races?' + qs);
  const data = await res.json();
  if (!data.success) throw new Error(data.error || 'API 錯誤');
  return data.data;
}
async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  try {
    const meetings = await fetchAPI('meetings');
    if (!meetings?.length) { el.innerHTML = '<p>目前沒有進行中的賽事</p>'; return; }
    el.innerHTML = meetings.map(m => `<div class="card"><h3>${m.venueCode} · ${m.date||''}</h3><p>${m.races?.length||0} 場</p></div>`).join('');
  } catch(e) { el.innerHTML = '<p class="error">' + e.message + '</p>'; }
}
function initChart() {
  const ctx = document.getElementById('oddsChart').getContext('2d');
  if (oddsChart) oddsChart.destroy();
  oddsChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'WIN 賠率', data: [], borderColor: '#8a9a5b', tension: 0.3, fill: true }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
}
async function updateOddsChart(race) {
  try {
    const odds = await fetchAPI('odds', {race, odds:'WIN'});
    const fav = odds?.[0]?.oddsNodes?.[0];
    if (!fav) return;
    if (!oddsHistory[race]) oddsHistory[race] = {labels:[], data:[]};
    const h = oddsHistory[race];
    h.labels.push(new Date().toLocaleTimeString('zh-HK'));
    h.data.push(parseFloat(fav.oddsValue)||0);
    if (h.labels.length > 10) { h.labels.shift(); h.data.shift(); }
    oddsChart.data.labels = h.labels;
    oddsChart.data.datasets[0].data = h.data;
    oddsChart.data.datasets[0].label = `第${race}場 ${fav.combString}`;
    oddsChart.update();
    document.getElementById('race-odds-content').innerHTML = odds[0].oddsNodes.slice(0,8).map(n => `<div>${n.combString}: <strong>${n.oddsValue}</strong></div>`).join('');
  } catch(e) { console.error(e); }
}
function startOddsTracking() {
  if (refreshInterval) clearInterval(refreshInterval);
  initChart();
  const race = document.getElementById('race-select').value;
  updateOddsChart(race);
  refreshInterval = setInterval(() => updateOddsChart(race), 15000);
}
async function loadResults() {
  const el = document.getElementById('results-content');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const races = await fetchAPI('races');
    el.innerHTML = `<pre>${JSON.stringify(races?.slice(0,1), null, 2).substring(0,600)}...</pre>`;
  } catch(e) { el.innerHTML = e.message; }
}
async function loadHorseDetails() {
  const el = document.getElementById('horse-content');
  try {
    const races = await fetchAPI('races');
    const runners = races?.[0]?.races?.[0]?.runners || [];
    el.innerHTML = '<table><tr><th>馬號</th><th>馬名</th><th>騎師</th><th>練馬師</th></tr>' + runners.slice(0,10).map(r => `<tr><td>${r.no}</td><td>${r.name_ch||r.name_en}</td><td>${r.jockey?.name_ch||''}</td><td>${r.trainer?.name_ch||''}</td></tr>`).join('') + '</table>';
  } catch(e) { el.innerHTML = e.message; }
}
document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
