<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Path · 金途</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --bg:#f8f4ed; --card:#fffdf9; --accent:#8a9a5b; --accent-strong:#6b7c4a; --text:#3a3a32; --text-dim:#7a7568; --border:#e8e2d6; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK TC",sans-serif; background:var(--bg); color:var(--text); margin:0; }
.header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--border); }
.nav button { background:transparent; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
.nav button.active { background:#f0eadf; color:var(--accent-strong); }
.container { max-width:1100px; margin:0 auto; padding:20px; }
.page { display:none; } .page.active { display:block; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:14px; }
.card h3 { color:var(--accent-strong); margin:0 0 10px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { padding:8px; border-bottom:1px solid var(--border); text-align:left; }
.loading { text-align:center; padding:24px; color:var(--text-dim); }
.error { color:#c45c5c; background:#fdf2f2; padding:10px; border-radius:6px; }
.badge { background:#e8f0dc; color:var(--accent-strong); padding:3px 8px; border-radius:12px; font-size:12px; }
.note { background:#fff8e6; color:#8a6d3b; padding:8px 12px; border-radius:8px; font-size:13px; margin-bottom:12px; }
button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; }
select, input { padding:6px 10px; border-radius:6px; border:1px solid var(--border); }
.chart-container { height:200px; margin-top:10px; }
footer { text-align:center; padding:16px; color:var(--text-dim); font-size:12px; }
</style>
</head>
<body>
<header class="header">
  <div><strong>金途</strong> Golden Path</div>
  <nav class="nav">
    <button class="active" onclick="showPage('dashboard')">總覽</button>
    <button onclick="showPage('race')">單場分析</button>
    <button onclick="showPage('results')">歷史賽果</button>
    <button onclick="showPage('prediction')">預測模型</button>
    <button onclick="showPage('horse')">馬匹詳情</button>
  </nav>
</header>
<div class="container">
  <section id="dashboard" class="page active"><div id="dashboard-content" class="loading">載入中...</div></section>
  <section id="race" class="page">
    <div class="card">
      <h3>單場分析 · 賠率走勢</h3>
      <select id="race-select" onchange="startOddsTracking()"><option value="1">第1場</option><option value="2">第2場</option><option value="3">第3場</option><option value="4">第4場</option><option value="5">第5場</option></select>
      <div id="odds-table" class="loading">選擇場次</div>
      <div class="chart-container"><canvas id="oddsChart"></canvas></div>
    </div>
  </section>
  <section id="results" class="page">
    <div class="card">
      <h3>歷史賽果完整表格</h3>
      <input type="date" id="result-date">
      <select id="result-venue"><option value="ST">沙田</option><option value="HV">跑馬地</option></select>
      <button onclick="loadHistoricalResults()">查詢</button>
      <div id="results-content" class="loading" style="margin-top:12px;">選擇日期查詢</div>
    </div>
  </section>
  <section id="prediction" class="page">
    <div class="card">
      <h3>預測模型</h3>
      <select id="pred-race"><option value="1">第1場</option><option value="2">第2場</option><option value="3">第3場</option><option value="4">第4場</option><option value="5">第5場</option></select>
      <button onclick="loadPrediction()">執行預測</button>
      <div id="prediction-content" class="loading" style="margin-top:12px;">點擊執行預測</div>
    </div>
  </section>
  <section id="horse" class="page"><div class="card"><h3>馬匹詳細往績</h3><div id="horse-content" class="loading">載入中...</div></div></section>
</div>
<footer>資料來源：香港賽馬會 · 僅供參考 · Golden Path · 金途</footer>
<script>
let oddsChart, refreshInterval, oddsHistory = {};
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'dashboard') loadDashboard();
  if (id === 'race') startOddsTracking();
  if (id === 'horse') loadHorseDetails();
  if (refreshInterval && id !== 'race') clearInterval(refreshInterval);
}
async function fetchAPI(type, params = {}) {
  const qs = new URLSearchParams({ type, ...params });
  const res = await fetch('/api/races?' + qs);
  return await res.json();
}
async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  el.innerHTML = '<div class="loading">載入中...</div>';
  try {
    const r = await fetchAPI('meetings');
    if (!r.success || !r.data?.length) {
      el.innerHTML = '<div class="card"><h3>目前沒有進行中的賽事</h3><p style="color:var(--text-dim);">暫無最近賽事資料</p></div>';
      return;
    }
    const isLive = r.isLive !== false;
    const note = r.note || (isLive ? '' : '顯示最近賽事');
    let html = note ? `<div class="note">${note}</div>` : '';
    html += r.data.map(m => {
      const venueName = m.venueCode === 'ST' ? '沙田' : m.venueCode === 'HV' ? '跑馬地' : m.venueCode;
      const raceCount = m.races?.length || 0;
      return `<div class="card">
        <h3>${venueName} · ${m.date || ''}</h3>
        <span class="badge">${raceCount} 場</span>
        <p style="margin-top:8px;color:var(--text-dim);">狀態：${m.status || (isLive ? '進行中' : '已結束')}</p>
        ${!isLive && m.races ? `<p style="margin-top:8px;font-size:13px;">最近一場：第${m.races[m.races.length-1]?.no || '-'} 場</p>` : ''}
      </div>`;
    }).join('');
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}
function initChart() {
  const ctx = document.getElementById('oddsChart')?.getContext('2d');
  if (!ctx) return;
  if (oddsChart) oddsChart.destroy();
  oddsChart = new Chart(ctx, { type:'line', data:{ labels:[], datasets:[{ label:'WIN', data:[], borderColor:'#8a9a5b', tension:0.3, fill:true }] }, options:{ responsive:true, maintainAspectRatio:false } });
}
async function updateOddsChart(race) {
  try {
    const r = await fetchAPI('odds', { race, odds:'WIN' });
    const nodes = r.data?.[0]?.oddsNodes || [];
    const fav = nodes[0];
    if (!fav) { document.getElementById('odds-table').innerHTML = '<p>暫無數據</p>'; return; }
    if (!oddsHistory[race]) oddsHistory[race] = { labels:[], data:[] };
    const h = oddsHistory[race];
    h.labels.push(new Date().toLocaleTimeString('zh-HK'));
    h.data.push(parseFloat(fav.oddsValue)||0);
    if (h.labels.length > 10) { h.labels.shift(); h.data.shift(); }
    if (oddsChart) { oddsChart.data.labels = h.labels; oddsChart.data.datasets[0].data = h.data; oddsChart.update(); }
    document.getElementById('odds-table').innerHTML = '<table><tr><th>馬號</th><th>WIN</th></tr>' + nodes.slice(0,8).map(n => '<tr><td>' + n.combString + '</td><td><strong>' + n.oddsValue + '</strong></td></tr>').join('') + '</table>';
  } catch(e) { document.getElementById('odds-table').innerHTML = '<div class="error">' + e.message + '</div>'; }
}
function startOddsTracking() {
  if (refreshInterval) clearInterval(refreshInterval);
  initChart();
  const race = document.getElementById('race-select').value;
  updateOddsChart(race);
  refreshInterval = setInterval(() => updateOddsChart(race), 15000);
}
async function loadHistoricalResults() {
  const el = document.getElementById('results-content');
  const date = document.getElementById('result-date').value || new Date().toISOString().slice(0,10);
  const venue = document.getElementById('result-venue').value;
  el.innerHTML = '<div class="loading">查詢中...</div>';
  try {
    const r = await fetchAPI('races', { date, venue });
    if (!r.success || !r.data?.length) { el.innerHTML = '<p>該日期沒有賽事</p>'; return; }
    const m = r.data[0];
    let html = '<h4>' + (venue==='ST'?'沙田':'跑馬地') + ' · ' + date + '</h4>';
    (m.races||[]).forEach(race => {
      html += '<h5 style="margin:14px 0 6px;">第' + race.no + '場</h5><table><tr><th>馬號</th><th>馬名</th><th>騎師</th><th>負磅</th><th>檔位</th></tr>';
      (race.runners||[]).slice(0,12).forEach(ru => { html += '<tr><td>' + ru.no + '</td><td>' + (ru.name_ch||ru.name_en||'-') + '</td><td>' + (ru.jockey?.name_ch||'-') + '</td><td>' + (ru.handicapWeight||'-') + '</td><td>' + (ru.barrierDrawNumber||'-') + '</td></tr>'; });
      html += '</table>';
    });
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}
async function loadPrediction() {
  const el = document.getElementById('prediction-content');
  const race = document.getElementById('pred-race').value;
  el.innerHTML = '<div class="loading">計算中...</div>';
  try {
    const r = await fetchAPI('predict', { race });
    if (!r.success || !r.predictions?.length) { el.innerHTML = '<p>暫無足夠數據</p>'; return; }
    el.innerHTML = '<table><tr><th>排名</th><th>馬號</th><th>賠率</th><th>勝出概率</th><th>信心</th></tr>' + r.predictions.map((p,i) => '<tr><td>' + (i+1) + '</td><td>' + p.horse + '</td><td>' + p.odds + '</td><td><strong>' + p.winProb + '%</strong></td><td>' + p.confidence + '</td></tr>').join('') + '</table>';
  } catch(e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}
async function loadHorseDetails() {
  const el = document.getElementById('horse-content');
  try {
    const r = await fetchAPI('races');
    const runners = r.data?.[0]?.races?.[0]?.runners || [];
    if (!runners.length) { el.innerHTML = '<p>暫無資料</p>'; return; }
    el.innerHTML = '<table><tr><th>馬號</th><th>馬名</th><th>騎師</th><th>練馬師</th><th>負磅</th><th>近6仗</th></tr>' + runners.slice(0,10).map(ru => '<tr><td>' + ru.no + '</td><td>' + (ru.name_ch||ru.name_en||'-') + '</td><td>' + (ru.jockey?.name_ch||'-') + '</td><td>' + (ru.trainer?.name_ch||'-') + '</td><td>' + (ru.handicapWeight||'-') + '</td><td>' + (ru.last6run||'-') + '</td></tr>').join('') + '</table>';
  } catch(e) { el.innerHTML = '<div class="error">' + e.message + '</div>'; }
}
document.addEventListener('DOMContentLoaded', () => { document.getElementById('result-date').value = new Date().toISOString().slice(0,10); loadDashboard(); });
</script>
</body>
</html>
